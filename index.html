<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; padding:24px 16px;
  display:flex; justify-content:center; align-items:center;
  font-family:"Cairo",Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(210,171,82,.18),transparent 25%),
    radial-gradient(circle at 90% 90%,rgba(13,35,66,.16),transparent 28%),
    linear-gradient(135deg,#f8f7f3,#eef1f5);
  color:#102542;
}
.card{
  width:100%; max-width:470px; overflow:hidden; position:relative;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(205,169,83,.35);
  border-radius:32px;
  box-shadow:0 22px 60px rgba(13,35,66,.18);
}
.top{
  position:relative; padding:34px 22px 27px; text-align:center;
  color:white; background:#0d2342;
}
.top:before,.top:after{
  content:""; position:absolute; width:170px;height:170px;border-radius:50%;
  border:1px solid rgba(215,177,91,.35);
}
.top:before{left:-100px;top:-110px}
.top:after{right:-100px;bottom:-120px}
.gold-line{
  width:70px;height:3px;margin:14px auto 17px;
  background:linear-gradient(90deg,transparent,#d8b66b,transparent);
}
.logo{
  width:78px;height:78px;margin:auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#17385f,#071a31);
  border:3px solid #d7b35f;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}
.logo svg{width:43px;height:43px;fill:#e7c879}
h1{font-size:25px;margin:16px 0 2px;font-weight:700}
.subtitle{margin:0;color:#e9dfc8;font-size:14px}
.content{padding:22px 18px 25px}
.grid{display:grid;gap:12px}
.item{
  display:flex;align-items:center;gap:13px;
  min-height:70px;padding:10px 13px;
  border-radius:19px;text-decoration:none;color:#102542;
  background:#fff;border:1px solid #e7e7e7;
  box-shadow:0 5px 16px rgba(13,35,66,.06);
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.item:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(13,35,66,.12);border-color:#d7b35f}
.icon{
  flex:0 0 50px;width:50px;height:50px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
}
.icon svg{width:28px;height:28px}
.phone .icon{background:#0d2342}.phone .icon svg{fill:#e4c16d}
.email .icon{background:#f4f0e6}.email .icon svg{width:31px;height:31px}
.facebook .icon{background:#1877f2}.facebook .icon svg,
.instagram .icon svg,.linkedin .icon svg{fill:white}
.instagram .icon{background:linear-gradient(135deg,#405de6,#c13584 52%,#fd1d1d 78%,#ffdc80)}
.linkedin .icon{background:#0a66c2}
.text{flex:1;min-width:0;text-align:right}
.label{display:block;font-size:15px;font-weight:700;margin-bottom:2px}
.value{
  display:block;font-family:Arial,sans-serif;font-size:13px;color:#687386;
  direction:ltr;text-align:right;overflow-wrap:anywhere;
}
.arrow{
  flex:0 0 24px;font-size:28px;line-height:1;color:#c49c4b;
  transform:rotate(180deg);
}
.footer{
  text-align:center;color:#9a9a9a;font-size:11px;margin-top:17px;
}
.footer span{color:#c49c4b}
</style>
</head>
