<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>التواصل معنا</title>

<style>
*{box-sizing:border-box}

html,body{margin:0;padding:0}

body{
  min-height:100vh;
  padding:18px 12px;
  font-family:Arial,"Tahoma",sans-serif;
  color:#17233a;
  background:#f8f7f3;
  position:relative;
  overflow-x:hidden;
}

/* زخارف الخلفية */
body:before,
body:after{
  content:"";
  position:fixed;
  z-index:0;
  pointer-events:none;
}

body:before{
  width:260px;
  height:260px;
  top:-105px;
  left:-105px;
  border-radius:50%;
  border:2px solid #d1b06a;
  box-shadow:
    0 0 0 9px #fff,
    0 0 0 11px #e3c985,
    0 0 0 20px #fff;
}

body:after{
  width:330px;
  height:180px;
  right:-170px;
  bottom:-70px;
  border-radius:50%;
  border:2px solid #d1b06a;
  transform:rotate(-18deg);
  box-shadow:0 0 0 8px #fff,0 0 0 10px #e3c985;
}

.card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:460px;
  margin:0 auto;
  background:rgba(255,255,255,.98);
  border:1px solid #ded5c1;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 8px 28px rgba(30,40,55,.10);
}

/* خطوط ذهبية زخرفية أعلى البطاقة */
.card:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:7px;
  background:#c9a24b;
}

/* زخارف نباتية بسيطة */
.decor{
  position:absolute;
  z-index:0;
  width:110px;
  height:150px;
  pointer-events:none;
  opacity:.7;
}
.decor.top-left{top:5px;left:0}
.decor.bottom-right{bottom:0;right:0;transform:rotate(180deg)}

.branch{
  position:absolute;
  width:85px;
  height:2px;
  background:#c9a24b;
  transform:rotate(-42deg);
  transform-origin:left center;
  top:30px;
  left:10px;
}
.leaf{
  position:absolute;
  width:25px;
  height:13px;
  border:1.5px solid #c9a24b;
  border-radius:100% 0 100% 0;
  transform:rotate(-35deg);
}
.l1{top:20px;left:34px}
.l2{top:42px;left:52px;transform:rotate(12deg)}
.l3{top:61px;left:68px;transform:rotate(-20deg)}
.l4{top:80px;left:82px;transform:rotate(18deg)}
.l5{top:97px;left:92px;transform:rotate(-25deg)}

.header{
  position:relative;
  z-index:2;
  text-align:center;
  padding:31px 18px 21px;
  background:#fff;
  border-bottom:1px solid #e8e3d8;
}

.profile{
  display:block;
  width:126px;
  height:126px;
  margin:0 auto 16px;
  object-fit:cover;
  object-position:center top;
  border-radius:50%;
  border:4px solid #c9a24b;
  background:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

h1{
  margin:0 0 7px;
  font-size:24px;
  font-weight:700;
  color:#17233a;
}

.subtitle{
  margin:0;
  font-size:15px;
  line-height:1.8;
  color:#555;
}

.gold-line{
  width:58px;
  height:2px;
  background:#c9a24b;
  margin:13px auto 0;
}

.content{
  position:relative;
  z-index:2;
  padding:18px 15px 23px;
}

.list{
  display:grid;
  gap:11px;
}

.btn{
  min-height:68px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 12px;
  border:1px solid #e1dccf;
  border-radius:16px;
  background:#fff;
  color:#17233a;
  text-decoration:none;
  box-shadow:0 3px 10px rgba(0,0,0,.045);
  transition:.18s ease;
}

.btn:hover{
  transform:translateY(-2px);
  border-color:#c9a24b;
  box-shadow:0 7px 17px rgba(0,0,0,.09);
}

.icon{
  width:50px;
  height:50px;
  flex:0 0 50px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon svg{width:29px;height:29px}

.phone .icon{background:#17233a}
.phone .icon svg{fill:#fff}

.email .icon{background:#f4f2ee}
.email .icon svg{width:32px;height:32px}

.facebook .icon{background:#1877f2}
.instagram .icon{background:#d62976}
.linkedin .icon{background:#0a66c2}

.facebook .icon svg,
.instagram .icon svg,
.linkedin .icon svg{fill:#fff}

.info{
  flex:1;
  min-width:0;
  text-align:right;
}

.name{
  display:block;
  font-size:15px;
  font-weight:700;
  margin-bottom:3px;
}

.value{
  display:block;
  font-size:13px;
  color:#687386;
  direction:ltr;
  text-align:right;
  overflow-wrap:anywhere;
}

.arrow{
  font-size:25px;
  color:#c9a24b;
  line-height:1;
}

.footer{
  text-align:center;
  color:#999;
  font-size:11px;
  margin-top:15px;
}

/* زخرفة ذهبية أسفل المحتوى */
.ornament{
  width:90px;
  height:1px;
  background:#c9a24b;
  margin:18px auto 0;
  position:relative;
}
.ornament:before,
.ornament:after{
  content:"";
  position:absolute;
  top:-4px;
  width:9px;
  height:9px;
  border:1px solid #c9a24b;
  transform:rotate(45deg);
  background:#fff;
}
.ornament:before{left:14px}
.ornament:after{right:14px}
</style>
</head>
