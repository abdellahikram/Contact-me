<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102746">
<title>مرحباً بكم | التواصل معنا</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Tahoma,Arial,sans-serif;
  background:#102746;
  min-height:100vh;
  padding:22px 12px;
  position:relative;
  overflow-x:hidden;
}

/* خلفية زخرفية واضحة */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 8% 8%,rgba(218,180,91,.35) 0 2px,transparent 3px),
    radial-gradient(circle at 92% 92%,rgba(218,180,91,.35) 0 2px,transparent 3px);
}

/* أقواس ذهبية في الخلفية */
.bg-top,.bg-bottom{
  position:fixed;
  width:430px;
  height:260px;
  border:3px solid #d9b65e;
  border-radius:50%;
  pointer-events:none;
  z-index:0;
}
.bg-top{top:-205px;left:-190px;transform:rotate(-18deg)}
.bg-bottom{bottom:-205px;right:-190px;transform:rotate(-18deg)}

.page{
  width:100%;
  max-width:470px;
  margin:auto;
  position:relative;
  z-index:1;
}

.card{
  position:relative;
  overflow:hidden;
  background:#fff;
  border:2px solid #d9b65e;
  border-radius:28px;
  box-shadow:0 18px 50px rgba(0,0,0,.30);
}

/* شريط علوي */
.card-head{
  position:relative;
  background:#fff;
  padding:30px 18px 24px;
  text-align:center;
}

/* زخارف نباتية مرسومة بـ CSS */
.flower{
  position:absolute;
  width:95px;
  height:120px;
  opacity:.75;
}
.flower.left{top:0;left:-8px}
.flower.right{top:0;right:-8px;transform:scaleX(-1)}
.stem{
  position:absolute;
  width:2px;
  height:105px;
  background:#d1a94e;
  left:38px;
  top:8px;
  transform:rotate(28deg);
}
.leaf{
  position:absolute;
  width:27px;
  height:14px;
  border:2px solid #d1a94e;
  border-radius:100% 0 100% 0;
}
.leaf.a{left:18px;top:22px;transform:rotate(-25deg)}
.leaf.b{left:42px;top:39px;transform:rotate(28deg)}
.leaf.c{left:13px;top:58px;transform:rotate(-28deg)}
.leaf.d{left:51px;top:73px;transform:rotate(30deg)}
.leaf.e{left:25px;top:91px;transform:rotate(-20deg)}

.photo-wrap{
  position:relative;
  width:140px;
  height:140px;
  margin:0 auto 17px;
  border-radius:50%;
  padding:5px;
  background:#d9b65e;
  box-shadow:0 5px 18px rgba(0,0,0,.18);
}
.photo-wrap:before{
  content:"";
  position:absolute;
  inset:-7px;
  border:1px solid #d9b65e;
  border-radius:50%;
}
.photo{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center top;
  border-radius:50%;
  background:#fff;
}

h1{
  position:relative;
  margin:0;
  color:#102746;
  font-size:25px;
}
.subtitle{
  position:relative;
  margin:7px 0 0;
  color:#4d5663;
  font-size:15px;
  line-height:1.8;
}
.divider{
  width:95px;
  height:2px;
  margin:14px auto 0;
  background:#d9b65e;
  position:relative;
}
.divider:after{
  content:"◆";
  position:absolute;
  font-size:10px;
  color:#d9b65e;
  left:50%;
  top:-8px;
  transform:translateX(-50%);
  background:#fff;
  padding:0 6px;
}

/* أزرار التواصل */
.content{
  padding:19px 16px 25px;
  background:#fff;
}
.list{display:grid;gap:11px}

.item{
  min-height:69px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 12px;
  border:1px solid #ddd;
  border-radius:17px;
  background:#fff;
  color:#14243d;
  text-decoration:none;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
  transition:.18s;
}
.item:hover{
  transform:translateY(-2px);
  border-color:#d9b65e;
  box-shadow:0 7px 18px rgba(0,0,0,.12);
}

.icon{
  width:51px;height:51px;flex:0 0 51px;
  border-radius:15px;
  display:flex;align-items:center;justify-content:center;
}
.icon svg{width:29px;height:29px}
.phone .icon{background:#102746}
.phone .icon svg{fill:#fff}
.email .icon{background:#f3f3f3}
.email .icon svg{width:32px;height:32px}
.facebook .icon{background:#1877f2}
.instagram .icon{background:#d62976}
.linkedin .icon{background:#0a66c2}
.facebook .icon svg,.instagram .icon svg,.linkedin .icon svg{fill:#fff}

.info{flex:1;min-width:0;text-align:right}
.label{display:block;font-size:15px;font-weight:bold;margin-bottom:3px}
.value{
  display:block;
  font:13px Arial,sans-serif;
  color:#697383;
  direction:ltr;
  text-align:right;
  overflow-wrap:anywhere;
}
.arrow{
  color:#c59e49;
  font-size:27px;
  line-height:1;
}

.footer{
  margin-top:17px;
  text-align:center;
  color:#9a9a9a;
  font-size:11px;
}
.footer-line{
  width:80px;height:1px;
  background:#d9b65e;
  margin:0 auto 9px;
}

/* زوايا ذهبية داخل البطاقة */
.corner{
  position:absolute;
  width:45px;height:45px;
  border-color:#d9b65e;
  border-style:solid;
  pointer-events:none;
}
.corner.tl{top:10px;left:10px;border-width:2px 0 0 2px;border-radius:12px 0 0 0}
.corner.tr{top:10px;right:10px;border-width:2px 2px 0 0;border-radius:0 12px 0 0}
.corner.bl{bottom:10px;left:10px;border-width:0 0 2px 2px;border-radius:0 0 0 12px}
.corner.br{bottom:10px;right:10px;border-width:0 2px 2px 0;border-radius:0 0 12px 0}
</style>
</head>
