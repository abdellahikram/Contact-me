<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>التواصل معنا</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:#fff;
  color:#17233a;
  font-family:Arial,"Tahoma",sans-serif;
  padding:18px 12px;
}
.card{
  width:100%;
  max-width:460px;
  margin:0 auto;
  background:#fff;
  border:1px solid #ddd;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 5px 22px rgba(0,0,0,.08);
}
.header{
  text-align:center;
  padding:26px 18px 20px;
  background:#fff;
  border-bottom:1px solid #e7e7e7;
}
.profile{
  display:block;
  width:125px;
  height:125px;
  margin:0 auto 16px;
  object-fit:cover;
  object-position:center top;
  border-radius:50%;
  border:3px solid #c8a24b;
  background:#fff;
}
h1{
  margin:0 0 8px;
  font-size:24px;
  font-weight:700;
  color:#17233a;
}
.subtitle{
  margin:0;
  font-size:15px;
  line-height:1.8;
  color:#555;
}
.line{
  width:55px;
  height:2px;
  background:#c8a24b;
  margin:14px auto 0;
}
.content{padding:18px 15px 22px}
.list{display:grid;gap:11px}
.btn{
  min-height:68px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 12px;
  border:1px solid #e1e1e1;
  border-radius:15px;
  background:#fff;
  color:#17233a;
  text-decoration:none;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
}
.icon{
  width:50px;
  height:50px;
  flex:0 0 50px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.icon svg{width:29px;height:29px}
.phone .icon{background:#17233a}
.phone .icon svg{fill:#fff}
.email .icon{background:#f2f2f2}
.email .icon svg{width:32px;height:32px}
.facebook .icon{background:#1877f2}
.instagram .icon{background:#d62976}
.linkedin .icon{background:#0a66c2}
.facebook .icon svg,
.instagram .icon svg,
.linkedin .icon svg{fill:#fff}
.info{flex:1;min-width:0;text-align:right}
.name{display:block;font-size:15px;font-weight:700;margin-bottom:3px}
.value{
  display:block;
  font-size:13px;
  color:#687386;
  direction:ltr;
  text-align:right;
  overflow-wrap:anywhere;
}
.arrow{font-size:25px;color:#c8a24b}
.footer{text-align:center;color:#999;font-size:11px;margin-top:15px}
</style>
</head>
