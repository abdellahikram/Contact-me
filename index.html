<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b50">
<title>مرحباً بكم | التواصل معنا</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  background:#102b50;
  color:#102b50;
  padding:20px 10px;
  overflow-x:hidden;
}

/* خلفية فاخرة كحلي + ذهبي */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 12% 8%,rgba(226,190,105,.28),transparent 22%),
    radial-gradient(circle at 90% 90%,rgba(226,190,105,.22),transparent 25%);
}

.page{
  width:100%;
  max-width:500px;
  margin:auto;
  position:relative;
  z-index:1;
}

.card{
  position:relative;
  overflow:hidden;
  background:#fff;
  border:2px solid #d7ad51;
  border-radius:30px;
  box-shadow:0 22px 55px rgba(0,0,0,.35);
}

/* موجات ذهبية علوية وسفلية */
.wave{
  position:absolute;
  width:430px;
  height:150px;
  border-radius:50%;
  border:10px solid #d7ad51;
  opacity:.95;
  pointer-events:none;
}
.wave:after{
  content:"";
  position:absolute;
  inset:-18px;
  border:2px solid #f0d48c;
  border-radius:50%;
}
.wave.top-left{top:-112px;left:-180px;transform:rotate(-20deg)}
.wave.top-right{top:-112px;right:-180px;transform:rotate(20deg)}
.wave.bottom-left{bottom:-112px;left:-180px;transform:rotate(20deg)}
.wave.bottom-right{bottom:-112px;right:-180px;transform:rotate(-20deg)}

/* زخرفة نباتية */
.branch{
  position:absolute;
  width:115px;
  height:120px;
  top:40px;
  pointer-events:none;
}
.branch.left{left:5px}
.branch.right{right:5px;transform:scaleX(-1)}
.branch:before{
  content:"";
  position:absolute;
  width:2px;
  height:115px;
  background:#c99b3d;
  left:45px;
  top:0;
  transform:rotate(28deg);
}
.leaf{
  position:absolute;
  width:34px;
  height:17px;
  border:2px solid #c99b3d;
  border-radius:100% 0 100% 0;
}
.leaf:nth-child(1){left:15px;top:18px;transform:rotate(-25deg)}
.leaf:nth-child(2){left:47px;top:30px;transform:rotate(25deg)}
.leaf:nth-child(3){left:8px;top:48px;transform:rotate(-28deg)}
.leaf:nth-child(4){left:53px;top:61px;transform:rotate(27deg)}
.leaf:nth-child(5){left:25px;top:82px;transform:rotate(-20deg)}
.leaf:nth-child(6){left:66px;top:91px;transform:rotate(25deg)}

.header{
  position:relative;
  text-align:center;
  padding:52px 20px 27px;
  background:#fff;
  border-bottom:1px solid #eadfca;
}

.photo-wrap{
  width:154px;
  height:154px;
  margin:0 auto 20px;
  padding:6px;
  border-radius:50%;
  background:linear-gradient(135deg,#b98527,#f3d98b,#b98527);
  box-shadow:0 7px 20px rgba(0,0,0,.20);
  position:relative;
  z-index:3;
}
.photo-wrap:before{
  content:"";
  position:absolute;
  inset:-7px;
  border:2px solid #d8b15c;
  border-radius:50%;
}
.photo{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center top;
  border-radius:50%;
  background:#eee;
}

h1{
  margin:0;
  font-size:30px;
  line-height:1.3;
  color:#102b50;
  font-weight:800;
}
.subtitle{
  margin:10px 0 0;
  font-size:17px;
  line-height:1.8;
  color:#27364a;
}
.divider{
  width:115px;
  height:2px;
  background:#d5a94e;
  margin:17px auto 0;
  position:relative;
}
.divider:after{
  content:"◆";
  position:absolute;
  left:50%;
  top:-9px;
  transform:translateX(-50%);
  color:#d5a94e;
  background:#fff;
  padding:0 9px;
  font-size:12px;
}

/* بطاقات التواصل */
.content{
  position:relative;
  padding:22px 17px 75px;
  background:#fff;
}
.list{display:grid;gap:13px}

.item{
  min-height:78px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 13px;
  background:#fff;
  border:1.5px solid #e1b65c;
  border-radius:20px;
  text-decoration:none;
  color:#102b50;
  box-shadow:0 7px 18px rgba(16,43,80,.09);
  transition:.18s ease;
}
.item:hover{
  transform:translateY(-2px);
  box-shadow:0 11px 25px rgba(16,43,80,.16);
}

.icon{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:3px solid #d9b45e;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
}
.icon svg{width:32px;height:32px}

.phone1 .icon{background:#12355f}
.phone2 .icon{background:#16b66a}
.phone1 .icon svg,.phone2 .icon svg{fill:#fff}

.email .icon{background:#fff}
.email .icon svg{width:38px;height:38px}

.facebook .icon{background:#1877f2}
.instagram .icon{background:linear-gradient(135deg,#405de6,#c13584 55%,#fd1d1d 80%,#ffdc80)}
.linkedin .icon{background:#0a66c2}
.facebook .icon svg,.instagram .icon svg,.linkedin .icon svg{fill:#fff}

.info{
  flex:1;
  min-width:0;
  text-align:right;
}
.label{
  display:block;
  font-size:18px;
  font-weight:800;
  margin-bottom:4px;
}
.value{
  display:block;
  font:15px Arial,sans-serif;
  color:#233e67;
  direction:ltr;
  text-align:right;
  overflow-wrap:anywhere;
}
.arrow-box{
  width:45px;
  height:45px;
  flex:0 0 45px;
  border-radius:14px;
  background:#fff7e7;
  border-right:1px solid #d8b15c;
  display:flex;
  align-items:center;
  justify-content:center;
}
.arrow{
  font-size:32px;
  line-height:1;
  color:#bd8424;
}

.footer{
  position:absolute;
  bottom:24px;
  left:0;
  right:0;
  text-align:center;
}
.footer-line{
  width:145px;
  height:2px;
  background:#d5a94e;
  margin:0 auto 10px;
}
.footer-text{
  color:#102b50;
  letter-spacing:5px;
  font:13px Georgia,serif;
}

/* زخرفة سفلية */
.bottom-branch{
  position:absolute;
  bottom:5px;
  width:125px;
  height:90px;
  pointer-events:none;
}
.bottom-branch.left{left:8px}
.bottom-branch.right{right:8px;transform:scaleX(-1)}
.bottom-branch:before{
  content:"";
  position:absolute;
  width:90px;
  height:2px;
  background:#c99b3d;
  top:65px;
  left:8px;
  transform:rotate(-20deg);
}
.bottom-leaf{
  position:absolute;
  width:30px;
  height:15px;
  border:2px solid #c99b3d;
  border-radius:100% 0 100% 0;
}
.bottom-leaf:nth-child(1){left:18px;top:44px;transform:rotate(-30deg)}
.bottom-leaf:nth-child(2){left:44px;top:52px;transform:rotate(20deg)}
.bottom-leaf:nth-child(3){left:68px;top:64px;transform:rotate(-25deg)}
</style>
</head>
