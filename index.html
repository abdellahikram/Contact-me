<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:20px;
  font-family:Arial,"Tahoma",sans-serif;
  background:linear-gradient(135deg,#f6f6f6,#e9edf2);
  color:#17213d;
}
.card{
  width:100%; max-width:460px; background:#fff; border-radius:30px;
  padding:30px 20px 24px; text-align:center;
  box-shadow:0 14px 45px rgba(0,0,0,.12);
}
.header-icon{
  width:82px;height:82px;border-radius:50%;margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;
  background:#10284b;border:4px solid #d7b15b;
  box-shadow:0 7px 18px rgba(16,40,75,.18);
}
.header-icon svg{width:48px;height:48px;fill:#f3cf78}
h1{font-size:23px;line-height:1.65;margin:0 0 8px;font-weight:700}
.subtitle{font-size:15px;color:#777;margin:0 0 24px}
.grid{display:grid;gap:13px}
.contact{
  position:relative; overflow:hidden;
  text-decoration:none;color:#17213d;
  border-radius:18px;padding:15px 16px;
  display:flex;align-items:center;gap:14px;
  border:1px solid rgba(0,0,0,.08);
  box-shadow:0 5px 15px rgba(0,0,0,.06);
  transition:transform .18s,box-shadow .18s;
  text-align:right;
}
.contact:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,0,0,.10)}
.icon{
  flex:0 0 54px;width:54px;height:54px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.icon svg{width:30px;height:30px}
.text{min-width:0;flex:1}
.label{font-size:16px;font-weight:700;margin-bottom:4px}
.value{font-size:14px;direction:ltr;text-align:right;overflow-wrap:anywhere;color:#4e5668}
.arrow{font-size:27px;color:#1b2944;line-height:1}
.phone{background:#f0fbf3}.phone .icon{background:#20c568}.phone .icon svg{fill:white}
.email{background:#fff5f4}.email .icon{background:#fff}.email .icon svg{width:36px;height:36px}
.facebook{background:#eff5ff}.facebook .icon{background:#1877f2}.facebook .icon svg{fill:white}
.instagram{background:#fff0f7}.instagram .icon{background:linear-gradient(135deg,#405de6,#c13584 55%,#fd1d1d 78%,#ffdc80)}.instagram .icon svg{fill:white}
.linkedin{background:#eef8ff}.linkedin .icon{background:#0a66c2}.linkedin .icon svg{fill:white}
small{display:block;margin-top:22px;color:#999;font-size:11px}
</style>
</head>
